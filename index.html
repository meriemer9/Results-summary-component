<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
   
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="main_container">
    <div class="left_container">
      <p class="your_result">Your Result</p>
      <div class="circle">
        <p class="circle__score">76</p>
        <p class="circle__total">of 100</p>
      </div>
      <p class="result">Great</p>
      <p class="comment">You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="right_container">
      <p class="summary">Summary</p>
      <div class="reaction_container">
        <div class="icon">
          <img class="reaction_icon" src="images/icon-reaction.svg" alt="icon of reaction">
          <p class="reaction">Reaction</p>
        </div>
        <div class="score">
          <p class="score_one">80 </p>
          <p class="on_total">/ 100</p>
        </div>
      </div>
      <div class="memory_container">
         <div class="icon">
          <img class="memory_icon" src="images/icon-memory.svg" alt="icon of memory">
          <p class="memory">Memory  </p>
        </div>
        <div class="score">
          <p class="score_two">92 </p>
          <p class="on_total">/ 100</p>
        </div>
      </div>
      <div class="verbal_container">
         <div class="icon">
          <img class="verbal_icon" src="images/icon-verbal.svg" alt="icon of verbal">
          <p class="verbal">  Verbal</p>
        </div>
        <div class="score">
          <p class="score_three">61 </p>
          <p class="on_total">/ 100</p>
        </div>
      </div>
       <div class="visual_container">
         <div class="icon">
          <img class="visual_icon" src="images/icon-visual.svg" alt="icon of reaction">
          <p class="visual">  Visual </p>
        </div>
        <div class="score">
          <p class="score_four">72 </p>
          <p class="on_total">/ 100</p>
        </div>
      </div>
      <div class="btn_box">
        <button class="continue_btn">Continue</button>
      </div>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Belhadj Meriem</a>.
  </footer>
</body>
</html>
